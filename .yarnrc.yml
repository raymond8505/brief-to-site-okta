# Yarn Berry config (pinned via packageManager: yarn@4.17.0 in package.json + Corepack).

# Real node_modules (no PnP) — best compatibility with Next 16, Storybook 10, Playwright.
nodeLinker: node-modules

# Supply-chain cooldown: refuse dependency versions published < 7 days ago.
# Unit is MINUTES (10080 = 7 days). Requires Yarn 4.10+ (we pin 4.17). Plain integer —
# the "7d" duration suffix is dropped by a known parser bug. Applies to transitive deps too.
npmMinimalAgeGate: 10080
